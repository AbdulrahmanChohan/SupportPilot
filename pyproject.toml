[project]
name = "supportpilot"
version = "0.1.0"
description = "SupportPilot: AI-Powered Customer Support Assistant"
readme = "README.md"
authors = [
    { name = "yasirbasheer10", email = "yasirmughal668@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.16.0",
    "fastapi>=0.162.7",
    "filelock>=3.13.0",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.3.0",
    "tabulate>=0.10.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
supportpilot = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
